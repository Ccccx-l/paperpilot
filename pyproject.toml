[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperpilot"
version = "0.1.0"
description = "PaperPilot: a local research-paper agent with traceable PDF evidence (built on mini-harness)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==2.45.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pypdf==6.21.2",
]

# Repository URL 待项目负责人确认后补充；不猜测正式仓库地址。

[project.scripts]
mini-harness = "mini_harness.main:main"
paperpilot = "paperpilot.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_harness", "src/paperpilot"]

[tool.hatch.build.targets.sdist]
include = ["src/mini_harness", "src/paperpilot", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# Keep the imported baseline intact; check syntax and definite name errors.
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
cache-dir = ".cache/uv"
